name: Releaser Core Tests

on:
  pull_request:
    paths:
      - "releaser/**"
      - ".github/workflows/releaser-tests.yml"
  push:
    branches:
      - main
    paths:
      - "releaser/**"
      - ".github/workflows/releaser-tests.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify Python version
        run: python3 --version
      - name: Run unit tests
        run: python3 -m unittest discover -s releaser/tests -v
      - name: Compile source
        run: python3 -m compileall -q releaser/core releaser/tests
