name: Releaser TypeScript Checks

on:
  pull_request:
    paths:
      - "releaser/**"
      - ".github/workflows/releaser-tests.yml"
  push:
    branches: [main]
    paths:
      - "releaser/**"
      - ".github/workflows/releaser-tests.yml"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: releaser/package-lock.json
      - name: Install locked dependencies without lifecycle scripts
        working-directory: releaser
        run: npm ci --ignore-scripts --no-audit
      - name: Typecheck, lint, test, format and verify checked-in bundles
        working-directory: releaser
        run: npm run check
