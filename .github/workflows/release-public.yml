name: Release (public)
on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Public repository name under okocraft (e.g. Hugs)"
        required: true
      version:
        description: "Version to release; must equal the project version at `ref`"
        required: true
      ref:
        description: "Branch, tag or SHA to release (default: the default branch)"
        default: ""
      tag:
        description: "Tag name (default: inferred from existing tags)"
        default: ""
      java-version:
        default: "25"

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      tag: ${{ steps.prepare.outputs.tag }}
    steps:
      - name: Check that the repository is public
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ inputs.repository }}
        run: |
          [[ "$REPO" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "Invalid repository: $REPO"; exit 1; }
          visibility="$(gh api "repos/okocraft/$REPO" --jq .visibility)"
          [ "$visibility" = public ] || { echo "okocraft/$REPO is $visibility, not public"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: okocraft/${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          path: target
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: public-ops
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
      - id: sha
        working-directory: target
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: prepare
        working-directory: target
        env:
          VERSION: ${{ inputs.version }}
          TAG: ${{ inputs.tag }}
        run: node ../public-ops/releaser/src/prepare.ts --version "$VERSION" --tag "$TAG" --out-dir ../dist
      - name: Summarize for approvers
        env:
          REPO: okocraft/${{ inputs.repository }}
          SHA: ${{ steps.sha.outputs.sha }}
          TAG: ${{ steps.prepare.outputs.tag }}
        run: |
          {
            echo "Release **$REPO** \`$TAG\` at $SHA"
            echo '```'
            (cd dist && sha256sum -- *)
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions: {}
    concurrency:
      group: release-${{ inputs.repository }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASER_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}
          owner: okocraft
          repositories: ${{ inputs.repository }}
          permission-contents: write
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist
      - env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: okocraft/${{ inputs.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          SHA: ${{ needs.build.outputs.sha }}
          PRERELEASE: ${{ contains(inputs.version, '-') }}
        run: |
          args=()
          if [ "$PRERELEASE" = true ]; then args+=(--prerelease); fi
          gh release create "$TAG" dist/* --repo "$REPO" --target "$SHA" --title "$TAG" --generate-notes "${args[@]}"
